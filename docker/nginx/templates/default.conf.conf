server {
    listen 80;
    server_name www.cnc.community;
    return 301 https://cnc.community$request_uri;
}

server {
    listen 80 default_server;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /home/${HOST_USER}/site/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml application/xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Vite output is content-hashed, so it can be cached indefinitely
    location ^~ /build/assets/ {
        expires max;
        access_log off;
        gzip_static on;
        try_files $uri =404;
    }

    location ~* ^/storage/.+\.(jpe?g|png|gif|webp|avif|svg)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Vendor scripts are referenced with a ?v=<filemtime> cache buster
    location ^~ /static/vendor/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/static/.+\.(jpe?g|png|gif|webp|avif|svg|ico|js|css|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}